# One-shot. Squash-merges maintainer PR 7, which the repository owner
# approved in chat. The validated head does not contain this file.
# This pull request must be closed without merging.
name: Owner-approved squash

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge the approved pull request
        uses: actions/github-script@v7
        with:
          script: |
            const pull_number = 7;
            const sha = "f0f0f74fdcb240facdabb2369a364e69034b7334";
            try {
              const { data } = await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number,
                merge_method: "squash",
                sha,
                commit_title: "Remove sample posts from the live board (#7)",
                commit_message: "Removes the three sample posts from the live board and keeps them as test fixtures. The site index still skips tests/ and templates/.",
              });
              core.info("merged=" + data.merged + " sha=" + data.sha);
            } catch (error) {
              const detail = error.response ? JSON.stringify(error.response.data) : String(error);
              core.setFailed(detail);
            }
