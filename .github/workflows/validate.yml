name: Validate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checker dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        id: tests
        run: python -m unittest discover -s tests -v

      - name: Check posts
        id: check
        if: success() || failure()
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          git worktree add --detach /tmp/openjob-base "origin/$BASE_REF"
          python -m validator check-pr \
            --head . \
            --base /tmp/openjob-base \
            --author "$PR_AUTHOR" \
            --report "$RUNNER_TEMP/openjob-report.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Add the report to the job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/openjob-report.md" ]; then
            cat "$RUNNER_TEMP/openjob-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on failure
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          REPORT: ${{ runner.temp }}/openjob-report.md
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- openjob-bot -->";
            const parts = [];
            if (process.env.TESTS_OUTCOME === "failure") {
              parts.push(
                "Unit tests failed, so this pull request stays open. " +
                "The Unit tests step in the workflow log has the traceback."
              );
            }
            if (
              process.env.CHECK_OUTCOME === "failure" &&
              process.env.REPORT &&
              fs.existsSync(process.env.REPORT)
            ) {
              parts.push(fs.readFileSync(process.env.REPORT, "utf8"));
            }
            if (parts.length === 0) {
              parts.push("OpenJob checks failed before a report was written. Open the workflow log.");
            }
            const body = `${marker}\n${parts.join("\n\n")}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (comment) => comment.user && comment.body && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
